
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTABOOK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial}
header{background:white;padding:18px;color:#873de5;
font-size:27px;font-weight:bold;text-align:center}
.stories{display:flex;gap:18px;padding:18px;
background:white;overflow:auto}
.story{text-align:center;min-width:60px;font-size:12px}
.circle{width:58px;height:58px;border-radius:50%;
background:linear-gradient(45deg,#ff9900,#e1306c,#833ab4);
padding:3px;margin:auto auto 5px}
.circle div{height:100%;border-radius:50%;
background:#eee;border:2px solid white}
.post{background:white;margin:12px 0;padding:14px}
.user{font-weight:bold;margin-bottom:12px}
.post img{width:100%;border-radius:8px}
.actions{font-size:25px;padding:12px 0;display:flex;gap:20px}
button{border:0;background:none;font-size:24px}
nav{position:fixed;bottom:0;background:white;width:100%;
display:flex;justify-content:space-around;padding:15px}
</style>
</head>
<body>
<header>INSTABOOK</header>

<div class="stories">
<div class="story"><div class="circle"><div></div></div>You</div>
<div class="story"><div class="circle"><div></div></div>Alex</div>
<div class="story"><div class="circle"><div></div></div>Sam</div>
<div class="story"><div class="circle"><div></div></div>John</div>
</div>

<div class="post">
<div class="user">🌟 instabook_official</div>
<img src="https://picsum.photos/600/400" alt="Post">
<div class="actions">
<button onclick="like(this)">♡</button>
<button onclick="alert('Comments coming soon!')">💬</button>
<button onclick="alert('Share coming soon!')">➤</button>
</div>
<b>Welcome to INSTABOOK!</b>
<p>Connect. Share. Explore. ❤️</p>
</div>

<nav>
<span>🏠</span><span>🔍</span>
<span onclick="alert('Post feature coming soon!')">➕</span>
<span>🎬</span><span>👤</span>
</nav>

<script>
function like(btn){
btn.innerText=btn.innerText==="♡"?"❤️":"♡";
}
</script>
</body>
                               </html>
